[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-image-classifier"
version = "1.0.0"
description = "Leakage-controlled NICE-style concept decoding from averaged EEG"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scikit-learn==1.9.0",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
nice = ["pillow>=10", "torch>=2.2", "transformers>=4.40"]

[project.scripts]
multimodal-eeg = "multimodal_eeg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
